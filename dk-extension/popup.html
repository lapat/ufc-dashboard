<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>BetBot DK Sync</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#ddd;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;font-size:12px;width:360px;padding:12px;user-select:none}
    
    /* Header & Health Pill */
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    h1{color:#e8b84b;font-size:0.85rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
    .version{color:#69db7c;font-size:0.62rem;font-weight:700;letter-spacing:0}
    #health-pill{display:inline-flex;align-items:center;gap:5px;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:12px;background:#181818;color:#888;border:1px solid #282828}
    #health-pill.ready{background:#0d2412;color:#69db7c;border-color:#69db7c55}
    #health-pill.warn{background:#2a2008;color:#e8b84b;border-color:#e8b84b55}
    #health-pill.idle{background:#161616;color:#888;border-color:#333}

    /* Primary Action */
    #btnLaunchTabs{width:100%;background:linear-gradient(180deg,#241c08,#151206);border:1px solid #e8b84b88;color:#e8b84b;padding:8px 10px;border-radius:6px;font-size:0.75rem;font-weight:700;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
    #btnLaunchTabs:hover{background:#2f240a;border-color:#e8b84b}

    /* Matchup & In-Extension Tagger */
    #capture-panel{background:#0e0e0e;border:1px solid #1c1c1c;border-radius:6px;padding:10px;margin-bottom:10px}
    #capture-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    #capture-hdr-label{font-size:0.58rem;color:#666;text-transform:uppercase;letter-spacing:1px;font-weight:700}
    #capture-live-badge{font-size:0.58rem;font-weight:700;padding:1px 6px;border-radius:4px;background:#181818;color:#555}
    #capture-live-badge.live{background:#0a2410;color:#69db7c;border:1px solid #69db7c44}
    #capture-live-badge.manual{background:#2b1d06;color:#e8b84b;border:1px solid #e8b84b44}
    
    #capture-fight{font-size:0.8rem;font-weight:700;color:#fff;margin-bottom:2px}
    #capture-odds{font-size:0.7rem;color:#e8b84b;margin-bottom:8px;font-weight:600}

    /* Tagger inside Extension */
    #ext-tagger-wrap{display:none;margin-top:8px;border-top:1px solid #1c1c1c;padding-top:8px}
    .ext-tag-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ext-fighter-col{display:flex;flex-direction:column;gap:4px}
    .ext-f-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
    .ext-f-name{font-size:0.68rem;font-weight:700;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}
    .ext-dog-btn{background:#181818;border:1px solid #333;color:#888;border-radius:3px;padding:1px 5px;font-size:0.58rem;font-weight:700;cursor:pointer}
    .ext-dog-btn.active{background:#e8b84b;color:#000;border-color:#e8b84b}
    .ext-pills{display:flex;flex-wrap:wrap;gap:3px}
    .ext-pill{background:#141414;border:1px solid #282828;color:#777;border-radius:3px;padding:2px 5px;font-size:0.58rem;cursor:pointer}
    .ext-pill.active{background:#e8b84b22;border-color:#e8b84b;color:#e8b84b;font-weight:700}
    
    /* Strategy & Crossover Banner in Popup */
    #ext-advice-box{display:none;margin-top:8px;padding:6px 8px;background:#141208;border:1px solid #e8b84b44;border-radius:4px;font-size:0.65rem;color:#e8b84b}
    #ext-advice-title{font-weight:700;margin-bottom:2px}
    #ext-advice-desc{font-size:0.6rem;color:#aaa}

    #fightStartedBtn{width:100%;margin-top:6px;background:#18150a;border:1px solid #e8b84b33;border-radius:4px;color:#aaa;font-size:0.65rem;padding:4px;cursor:pointer}
    #fightStartedBtn:hover{color:#e8b84b;border-color:#e8b84b88}
    #manualLiveRow{display:none;margin-top:4px;font-size:0.6rem;color:#69db7c;text-align:center}

    /* Launchers */
    .launcher-row{display:flex;gap:6px;margin-bottom:10px}
    .launcher-row a{flex:1;text-decoration:none;padding:6px;border-radius:4px;text-align:center;font-size:0.68rem;font-weight:700;transition:all .15s}
    .launcher-hud{background:#261f0a;border:1px solid #e8b84b88;color:#e8b84b}
    .launcher-hud:hover{background:#33290d}
    .launcher-sub{background:#161616;border:1px solid #282828;color:#aaa}
    .launcher-sub:hover{background:#222;color:#fff}

    /* Collapsible Diagnostics & Settings Drawer */
    .drawer-toggle{width:100%;background:#0d0d0d;border:1px solid #1a1a1a;color:#777;padding:5px 8px;border-radius:4px;font-size:0.62rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .drawer-toggle:hover{color:#ccc;border-color:#2a2a2a}
    #drawer-body{display:none;margin-top:6px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:4px;padding:8px}

    .user-row{display:flex;gap:5px;align-items:center;margin-bottom:8px}
    .user-row input{flex:1;background:#111;border:1px solid #2a2a2a;border-radius:3px;color:#ddd;font-size:0.68rem;padding:4px 6px;outline:none}
    .user-row input:focus{border-color:#e8b84b}
    .user-row button{background:#1a1a00;border:1px solid #e8b84b44;border-radius:3px;color:#e8b84b;font-size:0.62rem;padding:4px 8px;cursor:pointer}
    .user-row button.saved{background:#0a1a0a;border-color:#69db7c44;color:#69db7c}

    .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
    .stat{background:#121212;border:1px solid #1c1c1c;border-radius:4px;padding:5px 7px}
    .stat-label{font-size:0.55rem;color:#555;text-transform:uppercase;letter-spacing:0.5px}
    .stat-val{font-size:0.68rem;font-weight:600;margin-top:1px}
    
    .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:#333}
    .dot.green{background:#69db7c}
    .dot.red{background:#ff6b6b}
    .dot.yellow{background:#e8b84b}

    .sec-hdr{display:flex;justify-content:space-between;align-items:center;font-size:0.58rem;color:#555;text-transform:uppercase;margin:6px 0 3px}
    .clr{color:#555;cursor:pointer;text-decoration:underline}
    .clr:hover{color:#e8b84b}
    #debugLog{max-height:80px;overflow-y:auto;font-family:monospace;font-size:0.58rem;color:#555}
    .log-entry{padding:2px 0;display:flex;gap:5px}
    .log-ts{color:#444}
    .log-msg.bets{color:#69db7c}
    .log-msg.err{color:#ff6b6b}
  </style>
</head>
<body>
  <!-- Header & Live Health -->
  <div class="header">
    <h1>⚡ Bet Bot <span class="version">v3.4</span></h1>
    <div id="health-pill" class="idle">Checking…</div>
  </div>

  <!-- Primary Action -->
  <button id="btnLaunchTabs">🚀 Open 2 Fight Night Tabs (My Bets + UFC)</button>

  <!-- Matchup & In-Extension Tagger -->
  <div id="capture-panel">
    <div id="capture-hdr">
      <span id="capture-hdr-label">On-Screen Matchup</span>
      <span id="capture-live-badge">—</span>
    </div>
    <div id="capture-fight">No fight page open</div>
    <div id="capture-odds"></div>
    
    <!-- Inline Tagger -->
    <div id="ext-tagger-wrap">
      <div class="ext-tag-grid">
        <!-- Fighter 1 -->
        <div class="ext-fighter-col">
          <div class="ext-f-hdr">
            <span class="ext-f-name" id="ext-f1-name">F1</span>
            <button class="ext-dog-btn" id="ext-f1-dog">🐕 Raw Dog</button>
          </div>
          <div class="ext-pills" id="ext-f1-pills"></div>
        </div>
        <!-- Fighter 2 -->
        <div class="ext-fighter-col">
          <div class="ext-f-hdr">
            <span class="ext-f-name" id="ext-f2-name">F2</span>
            <button class="ext-dog-btn" id="ext-f2-dog">🐕 Raw Dog</button>
          </div>
          <div class="ext-pills" id="ext-f2-pills"></div>
        </div>
      </div>

      <!-- Advice Box -->
      <div id="ext-advice-box">
        <div id="ext-advice-title">⚡ Line-Flip Edge: --</div>
        <div id="ext-advice-desc"></div>
      </div>
    </div>

    <!-- Fallback Force Live -->
    <button id="fightStartedBtn">🥊 Force Live Capture (If DK Badge Missing)</button>
    <div id="manualLiveRow">
      Forcing live <span id="manualLiveCountdown"></span> · <span class="clr" id="cancelManualLive">cancel</span>
    </div>
  </div>

  <!-- Quick Launchers -->
  <div class="launcher-row">
    <a href="https://www.livebetbot.com/hud" target="_blank" class="launcher-hud">🔲 Open Fight HUD</a>
    <a href="https://www.livebetbot.com/" target="_blank" class="launcher-sub">⚡ Classic</a>
    <a href="https://www.livebetbot.com/guide" target="_blank" class="launcher-sub">📖 Guide</a>
  </div>

  <!-- Collapsible Diagnostics & Settings Drawer -->
  <button class="drawer-toggle" id="btnToggleDrawer">
    <span>⚙️ Diagnostics & Settings</span>
    <span id="drawerArrow">▾</span>
  </button>
  
  <div id="drawer-body">
    <!-- Username -->
    <div class="user-row">
      <input id="userInput" placeholder="Your username (e.g. louislapat, ish)" spellcheck="false"/>
      <button id="saveUser">Set</button>
    </div>

    <!-- Status Grid -->
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">DK Tab</div>
        <div class="stat-val"><span class="dot" id="tabDot"></span><span id="tabText">checking…</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">WebSocket</div>
        <div class="stat-val"><span class="dot" id="wsDot"></span><span id="wsText">checking…</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Last Bets Sync</div>
        <div class="stat-val" id="syncAge">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Bets Synced</div>
        <div class="stat-val" id="betCount">—</div>
      </div>
    </div>

    <!-- Raw Debug Log -->
    <div class="sec-hdr">
      <span>Event Log</span>
      <span class="clr" id="clrLog">clear</span>
    </div>
    <div id="debugLog"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
