<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bet Bot status</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14151a; --card: #1d1f26; --ink: #ecece8; --muted: #9a9ca6; --line: #2c2f38; --ok: #5fd18a; --warn: #e6b04c; --bad: #ff7b6b; }
  }
  :root[data-theme="dark"] { --bg: #14151a; --card: #1d1f26; --ink: #ecece8; --muted: #9a9ca6; --line: #2c2f38; --ok: #5fd18a; --warn: #e6b04c; --bad: #ff7b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 4px 0 14px; }
  h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .k { color: var(--muted); }
  .v { text-align: right; word-break: break-word; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .err { color: var(--bad); font-size: 0.85rem; word-break: break-word; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .stale { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }
</style>
</head>
<body>
<h1>Bet Bot status</h1>
<div class="grid">
  <section class="card" id="rec"><h2>Recorder</h2><div class="muted">Loading…</div></section>
  <section class="card" id="bk"><h2>Backups</h2><div class="muted">Loading…</div></section>
  <section class="card" id="dq"><h2>Recording data quality</h2><div class="muted">Loading…</div></section>
  <section class="card" id="ext"><h2>Extension cross-check</h2><div class="muted">Loading…</div></section>
</div>
<div class="stale" id="stamp"></div>
<script>
const esc = s => String(s ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = ts => { if (!ts) return '—'; const s = Math.round((Date.now() - new Date(ts).getTime()) / 1000); if (s < 90) return s + 's ago'; if (s < 5400) return Math.round(s/60) + ' min ago'; return Math.round(s/3600) + ' h ago'; };
const row = (k, v) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;

async function load() {
  try {
    const [rec, bk, recs] = await Promise.all([
      fetch('/api/recorder/status').then(r => r.json()),
      fetch('/api/recorder/backup-status').then(r => r.json()),
      fetch('/api/recordings').then(r => r.json()),
    ]);

    const active = rec.activeFights || [];
    const lastPollAge = rec.lastPoll ? (Date.now() - new Date(rec.lastPoll).getTime()) / 1000 : Infinity;
    const recState = lastPollAge > 600 ? pill('bad', 'stalled') : active.length ? pill('ok', 'recording ' + active.length) : pill('ok', 'idle, polling');
    document.getElementById('rec').innerHTML = `<h2>Recorder</h2>
      ${row('State', recState)}
      ${row('Last poll', esc(ago(rec.lastPoll)))}
      ${row('Poll interval', rec.lastDelayMs ? (rec.lastDelayMs/1000) + 's' : '—')}
      ${row('Saved files (this boot)', esc(rec.totalSaved))}
      ${row('Odds API errors (this boot)', rec.apiErrors > 0 ? pill('warn', rec.apiErrors) : pill('ok', 0))}
      ${row('Grace before a fight ends', esc(Math.round((rec.graceMs||0)/1000)) + 's')}
      ${active.map(f => row(f.fighter1 + ' vs ' + f.fighter2, esc(f.dataPoints) + ' pts · ' + esc(f.lastOdds?.timestamp ? ago(f.lastOdds.timestamp) : '—'))).join('')}`;

    const q = bk.github || {};
    const st = bk.stats || {};
    const bkState = bk.ok ? pill('ok', 'all backed up') : pill('bad', 'not backing up');
    document.getElementById('bk').innerHTML = `<h2>Backups</h2>
      ${row('Overall', bkState)}
      ${row('GitHub write access', q.ok ? pill('ok', 'yes') : pill('bad', 'no'))}
      ${row('Branch', esc(q.branch || '—'))}
      ${row('Queued for retry', st.pending > 0 ? pill('warn', st.pending) : pill('ok', 0))}
      ${row('Pushed this boot', esc(st.pushed))}
      ${row('Last success', esc(ago(st.lastOkAt)))}
      ${st.lastError ? `<div class="err">Last error: ${esc(st.lastError)}</div>` : ''}
      ${!q.ok && q.reason ? `<div class="err">${esc(q.reason)}</div>` : ''}`;

    const list = Array.isArray(recs) ? recs : [];
    const pts = list.map(r => r.dataPoints || 0);
    const thin = list.filter(r => (r.dataPoints || 0) < 100 && (r.dataPoints || 0) >= 10).length;
    const junk = list.filter(r => (r.dataPoints || 0) < 10).length;
    const ufc = list.filter(r => r.sport === 'UFC/MMA').length;
    const sorted = [...pts].sort((a, b) => a - b);
    const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
    document.getElementById('dq').innerHTML = `<h2>Recording data quality</h2>
      ${row('Recordings', esc(list.length) + ' (' + esc(ufc) + ' UFC)')}
      ${row('Median data points', esc(median))}
      ${row('Thin (10–99 points)', thin ? pill('warn', thin) : pill('ok', 0))}
      ${row('Junk (under 10 points)', junk ? pill('warn', junk) : pill('ok', 0))}
      <div class="muted" style="margin-top:8px">A full fight is expected to have 200+ points. Thin and junk files are kept, but treat their odds with caution.</div>`;

    const ex = rec.extPushes || 0;
    const exState = ex > 0 ? pill('ok', 'receiving') : pill('warn', 'no pushes yet');
    document.getElementById('ext').innerHTML = `<h2>Extension cross-check</h2>
      ${row('Status', exState)}
      ${row('Pushes received (this boot)', esc(ex))}
      ${row('Last push', esc(ago(rec.lastExtPush)))}
      <div class="muted" style="margin-top:8px">The extension only pushes while a LIVE badge is on the DraftKings page. Zero pushes during a card means that check is not firing.</div>`;

    document.getElementById('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('stamp').textContent = 'Could not load status: ' + e.message;
  }
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
